<div class="message-bar-container">
  <app-message-bar></app-message-bar>
</div>


<div class="navbar-buffer"></div>
<nav class="main-navbar">
  <div class="container navbar-container">
    <div class="navbar-content">
      <span class="brand-container">

        <a routerLink="" class="navbar-brand">BookBuddy</a>
      </span>
        <div class="right-controls">

            <!-- Search Bar -->
            <app-book-dropdown-option dropdown_type="navbar-search" dropdown_text="Search Books, Authors"></app-book-dropdown-option>

            <button *ngIf="!isLoggedIn" (click)="login()" mat-raised-button class="login">Log In</button>

              <!-- User Icon -->
             <ng-container *ngIf="isLoggedIn && userIconURL">
              <div class="user-icon"
                [style.background-image]="`url(${userIconURL})`"
                [matMenuTriggerFor]="userMenu" 
                #menuTrigger="matMenuTrigger">
              </div>
                <mat-menu class="navbar-dropdown"
                (mouseleave)="onMouseLeave(menuTrigger)" #userMenu="matMenu">
                  <div mat-menu-item>Manage Profile</div>
                  <div (click)="logout()" mat-menu-item>Log Out</div>
                </mat-menu>
             </ng-container>

            <!-- Menu Bar -->
             <div *ngIf="isLoggedIn" class="menu-icon-container" (click)="handleMenuIconClick()">
                <div [matMenuTriggerFor]="iconMenu" #menuTrigger="matMenuTrigger">
                  <mat-icon class="menu-icon">menu</mat-icon>
                  <mat-icon *ngIf="unreadNotifications === true" class="notification-dot">circle</mat-icon>
                </div>
                <mat-menu #iconMenu="matMenu">
                  <ng-container *ngFor="let notification of notifications">
                    <ng-container *ngIf="notification.type === NotificationType.BuddyRequest">
                      <div [matMenuTriggerFor]="buddyRequestMenu" #menuTrigger="matMenuTrigger"  mat-menu-item>{{buddyRequesterName(notification.actorId || '')}} sent you a Buddy Request</div>
                      <mat-menu  #buddyRequestMenu="matMenu">
                        <div mat-menu-item (click)="acceptBuddyRequest(notification)">Accept</div>
                        <div mat-menu-item (click)="ignoreBuddyRequest(notification)">Ignore</div>
                        <div mat-menu-item (click)="openMessageBar(notification)">Message</div>
                      </mat-menu>
                    </ng-container>
                  </ng-container>
                  <div mat-menu-item>Dashboard</div>
                  <div (click)="logout()" mat-menu-item>Log Out</div>
                </mat-menu>
            </div>

        </div>
    </div>
  </div>
  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
</nav>
<main>
  <router-outlet />
</main>
